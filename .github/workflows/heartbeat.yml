name: Heartbeat

# Generates a steady request floor across all four hosts so the Cloudflare
# dashboards can tell "idle" from "dead", and fails loudly when production
# stops answering correctly.
#
# workflow_dispatch is deliberate: without it the only way to test a change
# here is to wait for the next scheduled run.
#
# The cron below is a request, not a promise. Measured 2026-09-19 over the last
# 20 scheduled runs, it delivers every 203 minutes at the median and 332 at the
# worst. GitHub throttles scheduled workflows silently: it drops runs rather
# than queueing them, so every run that fires succeeds and nothing looks wrong.
#
# It stays '*/5' anyway. That declaration functions as continuous retry, and a
# sparse cron that gets dropped has no attempts behind it to catch - declaring
# '0 */3 * * *' would read honestly and might well deliver worse. The frequent
# shallow check that actually needs a kept schedule already moved to a
# Cloudflare cron trigger (apps/api/src/heartbeat.ts); what is left here is the
# deep authenticated check, where lateness costs less. See onlooker-txcu.5.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A slow run must never stack up behind the next scheduled one.
concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Check all environments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # THIS WORKFLOW IS NOT MONITORED, and that is a decision rather than an
      # oversight. It used to check in to a Sentry cron monitor here.
      #
      # Sentry Crons bills per ACTIVE monitor and this org has one seat. Two
      # monitors were created; the second was silently created DISABLED, and a
      # disabled monitor accepts check-ins with HTTP 202 and stores none - so
      # client-error-monitor.yml spent days reporting to nothing while its
      # check-in step printed "ok". Nothing could detect that: 202 means
      # accepted, not stored, and it is all the ingest endpoint returns.
      # onlooker-txcu.6.
      #
      # The one seat went to client-error-monitor.yml, because THIS workflow's
      # job is now largely covered elsewhere. apps/api runs the frequent
      # shallow check on a Cloudflare cron trigger, which GitHub's throttling
      # cannot reach. Whether Cloudflare keeps its own schedule has not been
      # measured here. It reports failures as Sentry ISSUES - and issues need
      # no cron seat. See apps/api/src/heartbeat.ts and
      # onlooker-txcu.5. Nothing else watches whether the client error monitor
      # runs at all.
      #
      # So what is lost here: if GitHub stops scheduling this workflow, the
      # DEEP authenticated checks stop and nobody is told. The shallow ones
      # continue from Cloudflare. That is the trade, written down so the next
      # person does not have to rediscover the seat limit to understand it.
      #
      # Restoring monitoring here means buying a second seat, not adding a
      # check-in step - a step alone would report into a disabled monitor and
      # print "ok" while doing it.

      # Staging runs first and never fails the job. It breaks by design during
      # deploys and migrations, and a monitor that fires during normal work is
      # one people mute. Its result still reaches you as an annotation, and the
      # requests still reach Cloudflare either way.
      - name: Staging (advisory)
        env:
          HEARTBEAT_EMAIL: ${{ secrets.HEARTBEAT_EMAIL_STAGING }}
          HEARTBEAT_PASSWORD: ${{ secrets.HEARTBEAT_PASSWORD_STAGING }}
          # Required here too. Staging is advisory, so a missing secret surfaces
          # as a warning rather than a failure - but it still surfaces, instead
          # of silently reducing this step to the read-only checks.
          HEARTBEAT_REQUIRE_AUTH: '1'
        run: |
          if ! scripts/heartbeat.sh staging; then
            echo "::warning title=Staging heartbeat failed::One or more staging checks did not return the expected status. This does not fail the run."
            echo "⚠️ **Staging heartbeat failed** — see the step log above." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      # Production failures fail the run, which is the whole alerting
      # mechanism: GitHub emails on workflow failure by default.
      - name: Production
        env:
          HEARTBEAT_EMAIL: ${{ secrets.HEARTBEAT_EMAIL_PRODUCTION }}
          HEARTBEAT_PASSWORD: ${{ secrets.HEARTBEAT_PASSWORD_PRODUCTION }}
          HEARTBEAT_REQUIRE_AUTH: '1'
        run: scripts/heartbeat.sh production
