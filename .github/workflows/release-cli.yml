name: Release CLI

# Tag-driven and separate from deploy.yml on purpose: shipping the CLI must
# never start a Cloudflare deploy, and a Cloudflare deploy must never cut a
# CLI release.
on:
  push:
    tags:
      - "cli-v*"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # setup-node enables package-manager caching by default: it finds
          # pnpm-lock.yaml and shells out to pnpm to resolve the store path,
          # which fails because pnpm is installed two steps below. Every
          # setup-node in deploy.yml disables it for the same reason.
          package-manager-cache: false

      # The tag decides what ships - Package below reads the version out of
      # GITHUB_REF_NAME - and nothing under apps/cli/src reads the manifest, so
      # a manifest left behind at the previous version breaks nothing here and
      # is wrong everywhere a human looks. Catch it before the build rather
      # than after the release is published and the tap has the number.
      - name: Check the tag against the manifest
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(jq -r .version apps/cli/package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::${GITHUB_REF_NAME} ships ${TAG_VERSION}, apps/cli/package.json says ${PKG_VERSION}"
            exit 1
          fi

      # pnpm is installed the way deploy.yml installs it, not via
      # pnpm/action-setup. Every action in this repository is an official
      # actions/* one, and a release workflow is a poor place to introduce the
      # first third-party dependency.
      - run: npm install -g pnpm@11.0.9
      - run: pnpm install --frozen-lockfile

      # A tag can point at any commit, including one that never passed
      # deploy.yml. What ships from here is a Homebrew formula, so an untested
      # build lands on users' machines and stays there until someone notices.
      # The whole workspace, not just the CLI: it bundles the lesson contract,
      # and a break in that surfaces here as a lesson the API refuses.
      - name: Test
        run: pnpm test

      # Same argument as the tests above, and it is not hypothetical. Reverting
      # apps/cli/src/prompt.ts to `node:readline/promises` reintroduces a
      # clear-text token leak that the vitest suite passes clean and only tsc
      # catches - measured. Until now nothing in this workflow would have
      # stopped that build reaching a user's machine.
      - name: TypeCheck
        run: pnpm typecheck

      - run: pnpm --filter @onlooker/cli build

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          tar -czf "onlooker-${VERSION}.tar.gz" -C apps/cli/dist onlooker.mjs
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "onlooker-${VERSION}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Homebrew 6 refuses to load a formula from a third-party tap until
          # the tap is trusted, and it refuses on upgrade as well as on a first
          # install - measured on 6.0.21 against a machine that had already
          # tapped and already installed. Anyone arriving here is about to hit
          # that, so the notes say it before brew does. onlooker-284 covers
          # saying it in the places people read before a release page.
          cat > notes.md <<'EOF'
          Push approved lessons to app.onlooker.dev.

          ```
          brew tap onlooker-community/tap
          brew trust onlooker-community/tap
          brew install onlooker
          ```

          Homebrew will not load this formula until the tap is trusted, and
          that applies to upgrading an existing install too.
          EOF
          # Idempotent, because the steps most likely to fail come after this
          # one and `gh release create` is a hard error on a tag that already
          # has a release. Measured on cli-v2.2.0: the token mint failed, the
          # release was already published, and the job could not be retried at
          # all - the first run poisoned every retry, so the only ways out were
          # deleting a public release or pushing the formula by hand.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists. Updating it in place."
            gh release upload "${GITHUB_REF_NAME}" \
              "onlooker-${{ steps.package.outputs.version }}.tar.gz" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "CLI ${{ steps.package.outputs.version }}" \
              --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              "onlooker-${{ steps.package.outputs.version }}.tar.gz" \
              --title "CLI ${{ steps.package.outputs.version }}" \
              --notes-file notes.md
          fi

      - name: Write the formula
        run: |
          node scripts/write-formula.mjs \
            "${{ steps.package.outputs.version }}" \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/onlooker-${{ steps.package.outputs.version }}.tar.gz" \
            "${{ steps.package.outputs.sha256 }}" > onlooker.rb
          cat onlooker.rb

      # Kept, and deliberately ahead of the push below rather than after it.
      # This used to be the only way the formula left the job; now it is the
      # fallback for when the push fails, and a fallback that only uploads on
      # the happy path is not one. Ordering it here also takes onlooker-d8z
      # (upload-artifact on the deprecated Node 20) off the critical path.
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: onlooker.rb

      # github.token is scoped to this repository and cannot write to the tap.
      # A GitHub App installation token rather than a fine-grained PAT: this
      # one is minted per run and dies in an hour, the private key behind it
      # has no 366-day expiry to forget, and the App belongs to the org instead
      # of to one person's account.
      #
      # actions/create-github-app-token is published by the actions org, so the
      # no-third-party-actions rule further up still holds.
      - name: Mint a token for the tap
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      # The step that was missing: until now the release was two steps and only
      # the first was automated, so `brew upgrade` served the previous version
      # for as long as it took someone to remember. Measured at 2 minutes once
      # and 32 minutes the next time.
      #
      # The tap's main carries two org-level rulesets. Main Branch Base wants
      # linear history, which one commit on a fresh clone gives it. Require
      # Pull Request has to list this App as a bypass actor - if it does not,
      # this step fails on a protected-branch rejection and the artifact above
      # is the way out. See docs/runbooks/2026-09-05-cli-release-tap-app.md.
      - name: Push the formula to the tap
        env:
          # The lookup below reads public user data, so it goes through the
          # repository token. The installation token is spent on the tap and
          # nothing else.
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ steps.tap.outputs.token }}
          APP_SLUG: ${{ steps.tap.outputs.app-slug }}
          VERSION: ${{ steps.package.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Committing as the App's own bot identity, which needs its numeric
          # user id. Anything else shows up in the tap's history as an unlinked
          # author and loses the trail back to which App pushed it.
          BOT_ID="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"

          # Not a shallow clone. The tap is a README and one formula, so --depth
          # buys nothing measurable, and pushing from a shallow clone is a class
          # of failure worth not owning.
          git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-tap.git" tap
          cp onlooker.rb tap/Formula/onlooker.rb
          cd tap
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Re-running an already-released tag regenerates a byte-identical
          # formula, because write-formula.mjs varies only url, sha256 and
          # version. Pushing nothing is the right answer there, not a failure.
          if git diff --quiet; then
            echo "Tap already at ${VERSION}. Nothing to push."
            exit 0
          fi

          git add Formula/onlooker.rb
          git commit -m "chore(onlooker): bump to ${VERSION} :package:" -m \
            "Generated by scripts/write-formula.mjs from the cli-v${VERSION} release in ${OWNER}/onlooker. Edit the generator, not this file."
          git push
