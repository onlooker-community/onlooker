# Not "Deploy to Cloudflare". Verification is the invariant and deploying is
# the exception: all three deploy and publish jobs are gated on main and push,
# so a pull request runs four jobs and deploys nothing at all. A push to main
# deploys only the surfaces `changes` reports, and publishes a package to npm
# that has nothing to do with Cloudflare. The old name described the last job
# on the happy path as though it were the workflow.
name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Deploy what is on main right now, without waiting for a commit to push.
  #
  # This exists because a green run is not the same as a deploy, and on
  # 2026-09-13 the difference stranded a change for hours. Two PRs merged a
  # minute apart: concurrency.cancel-in-progress killed the first deploy mid
  # flight, and the second run then computed `changes.deployable` as a diff
  # from the commit the first merge had just created - which contained none of
  # the first merge's files. Both runs went green, neither deployed, and the
  # only recovery was for somebody to notice and re-run a cancelled job.
  #
  # The deploy jobs below still require `github.ref == 'refs/heads/main'`, so
  # this cannot be used to ship a feature branch. It is deliberately
  # input-less: it does what a push to main does.
  #
  # The filter bug this was built to recover from is fixed - the change filter
  # now measures from what was last deployed rather than from the previous
  # commit (onlooker-txcu.7). This stays anyway. A manual deploy is worth having
  # for the failures nobody has had yet, and it costs one trigger line.
  workflow_dispatch:

# Cancel superseded pull request runs; never cancel a deploy of main.
#
# `true` for everything is what stranded #154 on 2026-09-13. Two PRs merged a
# minute apart, the first deploy was cancelled mid flight, and the second run
# then asked `changes` whether anything deployable had changed - computing that
# diff from `github.event.before`, which was the commit the FIRST merge had
# just created. The first merge's own files were not in that range, so the
# answer was "no" and both deploy jobs skipped. Two green runs, nothing
# deployed, and no failure anywhere to notice.
#
# Queuing instead of cancelling removes the cause rather than detecting it:
# every push to main gets its own deploy, so every diff is taken from the
# commit that actually deployed last. A burst of merges now takes longer
# instead of losing one.
#
# Pull requests keep cancelling, which is where it pays - the group is per-ref,
# so this only ever cancels an earlier run of the SAME pull request after a
# force-push, and nothing about that run was going to deploy.
#
# This alone never made the filter correct, and it no longer has to. A main run
# that ends before its deploy jobs - somebody hitting the button, a runner
# dying, a test failing - used to reopen the same hole, because
# `github.event.before` is not "the commit we last deployed". The filter now
# asks GitHub what each environment actually deployed and measures from there,
# so an interrupted run leaves its changes pending instead of losing them; see
# the `changes` job and onlooker-txcu.7. workflow_dispatch remains as the
# manual recovery either way.
# Pull request runs share a group per branch and cancel each other. Pushes to
# main get a group of their own, per commit, and so never wait for or cancel
# another run at all.
#
# Both halves of that are corrections to this block. It read
# `cancel-in-progress: true` for everything, which cancelled a main deploy the
# moment a second PR merged and stranded #154 - the second run then computed
# `changes.deployable` from the commit the first merge had just created and
# found nothing to do. Changing it to cancel only pull requests fixed the
# stranding and replaced it with something worse: the group was still shared
# across every push to main, so a run parked at the production approval gate
# HELD that group. On 2026-09-13 run 34800771982 sat unapproved for nineteen
# hours with #160's deploy queued behind it, zero jobs started, nothing
# alerting. The cron heartbeat it carried never reached production.
#
# Per-commit groups mean a push can neither be cancelled by a later one nor
# blocked by an earlier one. Serializing the deploys themselves is a narrower
# job, and it is done per job below, where it can be done without holding a
# whole run hostage.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.0.9'

jobs:
  # ============================================================================
  # LINT AND TYPECHECK
  # ============================================================================
  # No matrix. It listed two workspaces by hand while ten define a typecheck
  # script, so eight were never typechecked at all - including @onlooker/cli,
  # which ships to users' machines as a Homebrew formula. The gap was invisible
  # because every listed workspace passed. Running the root turbo tasks instead
  # means coverage follows the workspace list and cannot drift again.
  #
  # It was also duplicating work: the matrix re-ran all four script suites, the
  # install and the full build once per entry, none of which are
  # workspace-specific. Adding the missing eight would have run them ten times.
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The heartbeat's credential guard decides whether the authenticated
      # checks run at all. It is the one piece of that script that can fail
      # silently, by skipping forever, so it is pinned on every PR.
      - name: Heartbeat script tests
        run: bash scripts/heartbeat.test.sh

      # The client error monitor's filter key cannot be validated at runtime:
      # an unknown key returns success with zero matches, exactly like a quiet
      # window. These tests are the only thing standing between a working
      # monitor and one that is green forever, so they run on every PR.
      - name: Client error monitor script tests
        run: bash scripts/client-error-monitor.test.sh

      # Same failure mode as the monitor above, one step worse: the D1 sampler's
      # dataset and view names could not be confirmed against a live account, so
      # a wrong guess returns success with zero rows and reads as "no database
      # problem". These tests pin the arithmetic and keep those names
      # overridable, which is what makes a wrong guess a one-line fix.
      - name: D1 latency sampler script tests
        run: bash scripts/d1-latency-sample.test.sh

      # An alert rule that loses its environment filter starts paging a human
      # for staging work in progress - staging and production share one Sentry
      # project per app and are told apart by that tag alone. Nothing about
      # that failure looks like a failure; it looks like a noisy alert, which
      # gets muted, which costs the production signal too. These tests run on
      # every PR so a rule cannot lose it quietly.
      - name: Sentry alert rule tests
        run: bash scripts/sentry/apply.test.sh

      # The cron check-in script runs inside the two workflows that are this
      # project's only alarms. If it could fail its caller, Sentry having a bad
      # afternoon would look identical to production being down - and the
      # obvious fix for that false alarm is to delete the monitoring. These
      # tests keep every path in it exiting 0.
      - name: Sentry cron check-in tests
        run: bash scripts/sentry/checkin.test.sh

      # The change filter decides whether a merge reaches production at all,
      # and it fails silently in the direction that matters: a wrong "nothing
      # changed" is a green run that deployed nothing, which is what stranded a
      # commit on main for hours on 2026-09-13. Nothing downstream notices, so
      # these tests are the only thing that can.
      - name: Deployable filter tests
        run: bash scripts/deployable.test.sh

      # The visibility filter is the security boundary, and it is only in one
      # place while nothing else queries the tables. That is a property of which
      # files contain what, so it cannot be checked from inside the Workers test
      # pool.
      - name: Source guard tests
        run: bash scripts/source-guards.test.sh

      # The gate is the only thing that notices when the code on main is not
      # the code anybody is running, and like the deployable filter it fails
      # silently in the direction that matters: a wrong "nothing changed" is a
      # green merge that released nothing. That has already cost two releases,
      # #141/#142 and #167/#168.
      - name: CLI release gate tests
        run: bash scripts/cli-version.test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build

      # Turbo names the failing task in its output, so a red build still says
      # which workspace broke - that is what the per-workspace job names used
      # to provide.
      - name: Lint (every workspace)
        run: pnpm lint

      - name: TypeCheck (every workspace)
        run: pnpm typecheck

  # ============================================================================
  # LESSON CONTRACT VERSION GUARD
  # ============================================================================
  contract-version:
    name: Contract version bumped with schema
    runs-on: ubuntu-latest
    # Pull requests only: the comparison is against the PR's base, which a push
    # to main does not have.
    if: github.event_name == 'pull_request'
    steps:
      # Full history so the base ref is available to diff against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail if the schema changed without a version bump
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail

          if git diff --quiet "${BASE}...HEAD" -- packages/lesson-contract/schema/; then
            echo "lesson contract schema unchanged - nothing to check"
            exit 0
          fi

          echo "lesson contract schema changed; checking for a version bump"

          old="$(git show "${BASE}:packages/lesson-contract/package.json" | jq -r .version)"
          new="$(jq -r .version packages/lesson-contract/package.json)"

          if [ "${old}" = "${new}" ]; then
            echo "::error title=Schema changed without a version bump::packages/lesson-contract/schema/ changed but the version is still ${new}. Nothing would publish, so consumers would keep resolving the old contract. Bump the version - a schema_version change is a major bump."
            exit 1
          fi

          newest="$(printf '%s\n%s\n' "${old}" "${new}" | sort -V | tail -1)"
          if [ "${newest}" != "${new}" ]; then
            echo "::error title=Version moved backward::packages/lesson-contract went from ${old} to ${new}. Publishing that would move the latest dist-tag backward, and a consumer doing a bare install would silently get an older contract. This cannot be cleanly undone on a public registry."
            exit 1
          fi

          echo "version moved ${old} -> ${new}"

  cli-version:
    name: CLI released with its source
    runs-on: ubuntu-latest
    # Pull requests only, for contract-version's reason: the comparison is
    # against the PR's base, which a push to main does not have.
    if: github.event_name == 'pull_request'
    # Explicit because deploy.yml has no top-level permissions block. The label
    # read is the only thing this needs beyond a checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history so the base ref is available to diff against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The labels are read live from the API rather than from
      # github.event.pull_request.labels, which is a snapshot taken when the
      # run started. Adding the label after a failure therefore counts, and
      # costs a click plus "Re-run failed jobs" - which re-runs this job and
      # the gate and nothing else.
      #
      # The alternative was adding `labeled` to this workflow's pull_request
      # trigger, which would re-run quality, test and changes on every label
      # change. Gating those off for label events is worse: they would be
      # SKIPPED, and `required` counts skipped as passing, so labeling a pull
      # request would mint a green "All checks passed" from a run that tested
      # nothing.
      - name: Fail if CLI source changed without a release
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cli-version.sh

  # ============================================================================
  # PUBLISH THE LESSON CONTRACT
  # ============================================================================
  publish-contract:
    name: Publish lesson contract
    runs-on: ubuntu-latest
    needs: test
    # Merges to main only. Never publish from a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for short-lived
      # publish rights, so no long-lived NPM_TOKEN is stored in the repo.
      # Requires a trusted publisher configured on npmjs.com for this package,
      # naming this repository and this workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist/ is gitignored, so the tarball has nothing to ship without this.
      #
      # The assertion is not paranoia. `pnpm --filter <name>` exits 0 when the
      # filter matches nothing - it prints "No projects matched the filters" and
      # succeeds. Verified against pnpm 11.0.9, and --fail-if-no-match does not
      # change it. So a typo or a future rename would build nothing, exit clean,
      # and publish a tarball with no dist/ in it. Check the artifact exists
      # rather than trusting the build's exit code.
      - name: Build
        run: |
          set -euo pipefail
          pnpm --filter @onlooker-community/lesson-contract build
          if [ ! -s packages/lesson-contract/dist/index.js ]; then
            echo "::error title=Build produced no output::packages/lesson-contract/dist/index.js is missing or empty after the build. The --filter probably matched no project, which pnpm reports as success. Publishing now would ship a tarball without dist/."
            exit 1
          fi
          # Every schema the package ships, not just the headline one.
          # counter-observation.schema.json went unchecked for exactly as long
          # as this was a single hardcoded if, so add to this list when a schema
          # is added - `files: ["dist", "schema"]` means anything here ships.
          for schema in lesson counter-observation; do
            path="packages/lesson-contract/schema/${schema}.schema.json"
            if [ ! -s "$path" ]; then
              echo "::error title=Schema missing from the publish tree::${path} is missing or empty. These files are the reason this package is published; shipping without one produces a tarball that resolves for consumers and then fails them at validation."
              exit 1
            fi
          done

      - name: Publish if this exact version is not on the registry
        working-directory: packages/lesson-contract
        run: |
          set -euo pipefail

          # Trusted publishing needs npm >= 11.5.1. Older npm ignores the OIDC
          # token silently and falls back to looking for credentials it will not
          # find, so assert rather than discover that at publish time.
          npm_major_minor_patch="$(npm --version)"
          if ! printf '%s\n%s\n' "11.5.1" "${npm_major_minor_patch}" | sort -V -C; then
            echo "::error title=npm too old for trusted publishing::npm ${npm_major_minor_patch} does not support OIDC trusted publishing; 11.5.1 or newer is required. Bump NODE_VERSION or install a newer npm before this step."
            exit 1
          fi

          # id-token: write on this job is what makes OIDC possible. If that
          # permission is ever dropped, this variable disappears and npm would
          # fall back to searching for a token that no longer exists - failing
          # later and less legibly than this does.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC token unavailable::This job has no id-token permission, so npm cannot exchange an OIDC token for publish rights. Restore 'permissions: id-token: write' on the publish-contract job."
            exit 1
          fi

          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"

          # Fast path only. This asks whether the version is already on the
          # registry so the common no-op merge skips without a pointless publish
          # attempt - but it is NOT authoritative, and must not be treated as
          # such. A newly published package can 404 here for minutes while the
          # registry propagates: observed 2026-08-10, when 2.0.0 published at
          # 21:56:59 and this query still returned nothing at 22:01:22, four and
          # a half minutes later. Trusting it caused a republish attempt and a
          # red build. See onlooker-1um.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry; nothing to do"
            exit 0
          fi

          echo "registry did not report ${name}@${version}; attempting publish"

          # The registry is the authority, so interpret its answer rather than
          # predicting it. A publish that fails *because the version exists* is
          # the same outcome as the fast path above - benign, and not a build
          # failure. Any other failure is real and must surface.
          set +e
          publish_out="$(npm publish 2>&1)"
          publish_rc=$?
          set -e

          printf '%s\n' "${publish_out}"

          if [ "${publish_rc}" -eq 0 ]; then
            echo "published ${name}@${version}"
            exit 0
          fi

          # Match the specific message, not the E403 code. E403 also covers
          # "you do not have permission", which is emphatically not benign.
          if printf '%s' "${publish_out}" | grep -q 'cannot publish over the previously published versions'; then
            echo "::notice title=Already published::${name}@${version} was already on the registry; the pre-check missed it, most likely registry propagation lag. Treating as a no-op."
            exit 0
          fi

          echo "::error title=Publish failed::${name}@${version} could not be published, and not because it already exists. See the npm output above."
          exit "${publish_rc}"

  # ============================================================================
  # BUILD AND TEST
  # ============================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: quality
    if: success()
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify generated schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- packages/lesson-contract/schema)" ]; then
            git status --short -- packages/lesson-contract/schema
            echo "::error::packages/lesson-contract/schema is out of date. Run 'pnpm --filter @onlooker-community/lesson-contract build' and commit the result."
            exit 1
          fi

      - name: Test
        run: pnpm test

  # ============================================================================
  # WHICH SURFACES CHANGED
  # ============================================================================
  changes:
    name: Which surfaces changed
    runs-on: ubuntu-latest
    # Narrower than the workflow default, and only what the question needs:
    # read the repository, read what has been deployed to it.
    permissions:
      contents: read
      deployments: read
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The base of the diff is now whatever commit last reached an
          # environment, which can be many commits back. A shallow fetch does
          # not have it.
          fetch-depth: 0

      - name: Decide whether anything deployable changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The logic lives in scripts/deployable.sh so it can be tested
          # offline - see scripts/deployable.test.sh, which the lint job runs.
          # This filter decides whether a merge reaches production at all, and
          # it used to be a dozen untested lines of shell embedded in YAML
          # where the only way to exercise a change was to merge it.
          #
          # It answers per environment because production sits behind a
          # required reviewer and can trail staging while an approval waits.
          # The run deploys if EITHER environment is missing something.
          #
          # That OR is the fix for the case a single answer cannot express:
          # staging deploying successfully while production fails. Anchored on
          # staging alone the next push would see nothing new and skip, leaving
          # a change that never reached production with two green runs behind
          # it. Asking both means the work stays pending until it has actually
          # shipped everywhere. See onlooker-txcu.7.
          #
          # Erring toward deploying is deliberate throughout: a redundant
          # deploy costs a few minutes, a skipped one ships nothing and says it
          # succeeded.
          if [ "${{ github.event_name }}" != "push" ]; then
            # Nothing below main deploys anyway - every deploy job is gated on
            # the ref - so there is no diff worth computing here.
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failure here must not become a blocked deploy. The script answers
          # `true` for every failure it anticipates - no deployments on record,
          # an unreachable API, a base commit missing from the clone - but this
          # step runs under `bash -e`, so anything it did NOT anticipate would
          # fail the step and skip every deploy behind it. That is the exact
          # outcome the filter exists to prevent, so the unanticipated case gets
          # the same answer as the anticipated ones.
          #
          # `if ! VAR="$(...)"` rather than a `&&` chain: a failed test in a
          # `&&` list is itself a failed command, so the tidier-looking version
          # fails the step under `bash -e` on exactly the path it was written to
          # rescue. Inside an `if` condition, a non-zero status is data.
          if ! STAGING="$(./scripts/deployable.sh staging)"; then
            echo "deployable: staging check failed; deploying rather than guessing"
            STAGING=true
          fi
          if ! PRODUCTION="$(./scripts/deployable.sh production)"; then
            echo "deployable: production check failed; deploying rather than guessing"
            PRODUCTION=true
          fi
          echo "staging=${STAGING} production=${PRODUCTION}"

          if [ "$STAGING" = "true" ] || [ "$PRODUCTION" = "true" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Two staging deploys must never run at once - they migrate the same D1
    # database and deploy over the same workers - so they queue.
    #
    # cancel-in-progress is false and must stay false. A cancel here can land
    # between `wrangler d1 migrations apply` and the deploy that expects the new
    # schema, and GitHub cannot tell a job waiting for its turn from one halfway
    # through a migration. A superseded staging deploy costs a few minutes; an
    # interrupted migration costs a database.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # Staging tracks main. There is no long-lived staging branch to keep in sync,
    # and production below will not run unless this succeeds first.
    #
    # `changes.deployable` keeps a CLI-only merge from redeploying the API, web
    # and website with identical code.
    #
    # That used to be justified here by cancel-in-progress being able to cancel
    # a deploy already in flight, which is no longer true of main - see the
    # concurrency block.
    #
    # What it earns now is narrower and safer than either. The filter measures
    # from what each environment last deployed, not from the previous commit,
    # so it skips only a commit whose deployable files are already live
    # everywhere. A commit whose deploy never landed stays pending no matter how
    # many pushes follow it - which is the opposite of the behavior this gate
    # used to have, and the reason onlooker-txcu.7 could happen at all.
    #
    # A manual run ignores `deployable` on purpose. The whole reason to reach
    # for the button is that the filter answered "nothing to do" and was
    # wrong - so honoring it here would make the recovery path skip for
    # exactly the reason recovery was needed.
    if: >-
      github.ref == 'refs/heads/main'
      && (
        (github.event_name == 'push' && needs.changes.outputs.deployable == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    environment:
      name: staging
      url: https://app-staging.onlooker.dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations to Staging
        run: pnpm migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Staging schema matches source
        run: pnpm --filter @onlooker/db verify:schema onlooker-db-staging staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --var is appended to the script rather than written into wrangler.toml
      # because the value differs per deploy and a config file cannot hold it.
      # Wrangler MERGES this with the vars the file declares - verified against
      # wrangler 4.102.0 with `deploy --dry-run`, which listed all seven
      # staging vars plus this one. If that ever stops being true, the worker
      # loses its DB binding and every authenticated route 500s, so re-check
      # the dry run before changing this line.
      - name: Deploy API to Staging
        run: pnpm deploy:api:staging --var MONITORING_RELEASE:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Rebuilds the bundle rather than shipping the one "Build" produced. That
      # step runs `vite build` with no mode, which resolves .env.production and
      # bakes in api.onlooker.dev - and since the production job below ships the
      # same dist/, staging spent its life calling the production API against
      # the production database. VITE_* is inlined at build time, so a staging
      # bundle is the only way to aim staging anywhere else. The build fails if
      # what it produced does not call api-staging.onlooker.dev.
      #
      # That rebuild is also why the release belongs here and not on the
      # "Build" step above: VITE_* is inlined by whichever `vite build` produced
      # the bundle being shipped, and this is that build. Vite picks prefixed
      # names up from the process environment, so this needs no .env entry.
      - name: Deploy Web to Staging
        run: pnpm deploy:web:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_MONITORING_RELEASE: ${{ github.sha }}
          # Uploads the source maps for this bundle, under the release above.
          # vite.config.ts reads the same VITE_MONITORING_RELEASE, so the maps
          # are filed under exactly the release the running app reports. Absent
          # on PR builds, where the plugin disables itself rather than failing.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # The same assertions the cron heartbeat makes, run against what was just
      # deployed. Nothing between "wrangler deploy succeeded" and "a human
      # clicks something" used to look at the deployed site at all - the Verify
      # steps above are schema checks - which is how a production outage where
      # every route except / returned 404 survived several deploys.
      #
      # One script, two triggers. Here it fails the run while the change is
      # still in front of whoever made it; on the cron it catches drift
      # afterwards.
      #
      # The credentials below are what make the first sentence true. Without
      # them auth_preflight skips checks 5-8 and this gate silently asserts only
      # that the API can still say no - directly after the step that applies D1
      # migrations, which is the likeliest way to break saying yes.
      - name: Smoke test Staging
        env:
          HEARTBEAT_EMAIL: ${{ secrets.HEARTBEAT_EMAIL_STAGING }}
          HEARTBEAT_PASSWORD: ${{ secrets.HEARTBEAT_PASSWORD_STAGING }}
          HEARTBEAT_REQUIRE_AUTH: '1'
        run: ./scripts/heartbeat.sh staging

      - name: Notify Deployment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ job.status }}';
            const deployment_url = 'https://app-staging.onlooker.dev';
            const commit_sha = '${{ github.sha }}'.substring(0, 7);

            console.log(`Staging deployment: ${status}`);
            console.log(`URL: ${deployment_url}`);
            console.log(`Commit: ${commit_sha}`);

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Production deploys queue, for the same migration reason as staging.
    #
    # THE KNOWN LIMIT, so nobody rediscovers it the way it was found: a run
    # parked at the approval gate below still holds THIS group, so a later
    # production deploy waits behind it until somebody approves or rejects. The
    # difference from before is the blast radius. It used to hold the whole
    # workflow group, so a later run could not even reach staging - nineteen
    # hours of that on 2026-09-13, with zero jobs started and nothing alerting.
    # Now staging keeps deploying, so main and the staging environment stay in
    # step, and only the production step waits on the human it is supposed to
    # wait on.
    #
    # cancel-in-progress stays false here too, and the temptation is real: true
    # would auto-clear a forgotten approval, since a later commit on a linear
    # main contains the earlier one. It would also be free to cancel a
    # production deploy that is midway through applying a migration, because
    # GitHub cannot distinguish the two states. Not worth it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Depends on deploy-staging, not test: production never ships a build that
    # has not already migrated and deployed cleanly to staging. The approval
    # gate on the production environment still applies on top of this.
    needs: deploy-staging
    # A manual run reaches production the same way a push does: only after
    # staging has migrated and deployed cleanly, and only through the approval
    # gate below. The button skips the change filter, never the gate.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://app.onlooker.dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Website source maps upload during `astro build`, which is this
          # step. `pnpm deploy:website` is wrangler-only and never sees it.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Apply D1 migrations to Production
        run: pnpm migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Production schema matches source
        run: pnpm --filter @onlooker/db verify:schema onlooker-db production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # See the staging deploy for why --var is appended rather than declared.
      - name: Deploy API to Production
        run: pnpm deploy:api:prod --var MONITORING_RELEASE:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Also rebuilds, for the mirror-image reason: now that a staging build
      # exists and writes to the same dist/, whoever ran last would otherwise
      # decide what production ships. Each web deploy builds the bundle it
      # deploys, and asserts the bundle calls the API that deploy is named for.
      - name: Deploy Web to Production
        run: pnpm deploy:web:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The same commit the API deploy above was given. A trace that starts
          # in the browser and ends in the worker carries one release or two
          # depending on this line.
          VITE_MONITORING_RELEASE: ${{ github.sha }}
          # See the staging deploy: this is what makes a production stack name a
          # function instead of a column number.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # The marketing site has no staging counterpart: apps/website declares no
      # environments, so there is one worker and one deploy. It sits in this job
      # rather than its own so it is behind the same production approval gate as
      # everything else user-facing.
      #
      # Until this step existed, merging a website change shipped nothing and
      # the run still went green.
      - name: Deploy Website to Production
        run: pnpm deploy:website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runs after the website deploy as well as the app and API, so it is the
      # last word on a production release. A failure here means production is
      # already serving the bad build - the gate is the alarm, not the
      # prevention - but the alarm rings in the run that caused it, next to the
      # commit responsible, rather than whenever the next periodic check
      # happens to notice.
      #
      # This used to say "up to 31 minutes later on the cron". That number was
      # wrong twice over: heartbeat.yml delivers every ~203 minutes, not 31
      # (measured 2026-09-19), and the frequent check no longer lives there at
      # all - it runs on a Cloudflare cron trigger declared every five minutes.
      # Whether Cloudflare keeps that schedule has not been measured here; the
      # move was made because GitHub demonstrably does not keep its own.
      # See onlooker-txcu.5.
      - name: Smoke test Production
        env:
          HEARTBEAT_EMAIL: ${{ secrets.HEARTBEAT_EMAIL_PRODUCTION }}
          HEARTBEAT_PASSWORD: ${{ secrets.HEARTBEAT_PASSWORD_PRODUCTION }}
          HEARTBEAT_REQUIRE_AUTH: '1'
        run: ./scripts/heartbeat.sh production

      - name: Notify Deployment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ job.status }}';
            const deployment_url = 'https://app.onlooker.dev';
            const commit_sha = '${{ github.sha }}'.substring(0, 7);

            console.log(`Production deployment: ${status}`);
            console.log(`URL: ${deployment_url}`);
            console.log(`Commit: ${commit_sha}`);

  # ============================================================================
  # REQUIRED CHECK GATE
  # ============================================================================
  # The single context the org ruleset requires, so branch rules never name
  # individual jobs. Renaming or adding a verification job above is a workflow
  # change; it is not also a ruleset change in an org setting nobody reading
  # this file can see.
  #
  # This is what makes "enable auto-merge" work at all. With no required check
  # and zero required approvals, a pull request is mergeable the moment it
  # opens, so GitHub has nothing to wait for and never offers the button.
  #
  # Every job that runs on a pull request is listed. A job that runs on a PR
  # but is missing here can fail red while the gate reports green, which is
  # worse than not gating it at all.
  required:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [quality, test, contract-version, cli-version, changes]
    # Without always(), one failed dependency skips the gate rather than
    # failing it, and a skipped required check is pending forever.
    if: always()
    steps:
      - name: Check results
        run: |
          # `contract-version` and `cli-version` are pull-request-only, so both
          # are skipped on a push to main - expected, not a failure. Anything
          # other than success or skipped fails the gate.
          for r in "${{ needs.quality.result }}" \
                   "${{ needs.test.result }}" \
                   "${{ needs.contract-version.result }}" \
                   "${{ needs.cli-version.result }}" \
                   "${{ needs.changes.result }}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "One or more required checks failed (got: $r)"
              exit 1
            fi
          done
          echo "All required checks passed"
