name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.0.9'

jobs:
  # ============================================================================
  # LINT AND TYPECHECK
  # ============================================================================
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
          - '@onlooker/api'
          - '@onlooker/web'
    steps:
      - uses: actions/checkout@v5

      # The heartbeat's credential guard decides whether the authenticated
      # checks run at all. It is the one piece of that script that can fail
      # silently, by skipping forever, so it is pinned on every PR.
      - name: Heartbeat script tests
        run: bash scripts/heartbeat.test.sh

      # The client error monitor's filter key cannot be validated at runtime:
      # an unknown key returns success with zero matches, exactly like a quiet
      # window. These tests are the only thing standing between a working
      # monitor and one that is green forever, so they run on every PR.
      - name: Client error monitor script tests
        run: bash scripts/client-error-monitor.test.sh

      # Same failure mode as the monitor above, one step worse: the D1 sampler's
      # dataset and view names could not be confirmed against a live account, so
      # a wrong guess returns success with zero rows and reads as "no database
      # problem". These tests pin the arithmetic and keep those names
      # overridable, which is what makes a wrong guess a one-line fix.
      - name: D1 latency sampler script tests
        run: bash scripts/d1-latency-sample.test.sh

      # The visibility filter is the security boundary, and it is only in one
      # place while nothing else queries the tables. That is a property of which
      # files contain what, so it cannot be checked from inside the Workers test
      # pool.
      - name: Source guard tests
        run: bash scripts/source-guards.test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build

      - name: Lint (${{ matrix.workspace }})
        run: pnpm --filter ${{ matrix.workspace }} lint

      - name: TypeCheck (${{ matrix.workspace }})
        run: pnpm --filter ${{ matrix.workspace }} typecheck

  # ============================================================================
  # LESSON CONTRACT VERSION GUARD
  # ============================================================================
  contract-version:
    name: Contract version bumped with schema
    runs-on: ubuntu-latest
    # Pull requests only: the comparison is against the PR's base, which a push
    # to main does not have.
    if: github.event_name == 'pull_request'
    steps:
      # Full history so the base ref is available to diff against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail if the schema changed without a version bump
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail

          if git diff --quiet "${BASE}...HEAD" -- packages/lesson-contract/schema/; then
            echo "lesson contract schema unchanged - nothing to check"
            exit 0
          fi

          echo "lesson contract schema changed; checking for a version bump"

          old="$(git show "${BASE}:packages/lesson-contract/package.json" | jq -r .version)"
          new="$(jq -r .version packages/lesson-contract/package.json)"

          if [ "${old}" = "${new}" ]; then
            echo "::error title=Schema changed without a version bump::packages/lesson-contract/schema/ changed but the version is still ${new}. Nothing would publish, so consumers would keep resolving the old contract. Bump the version - a schema_version change is a major bump."
            exit 1
          fi

          newest="$(printf '%s\n%s\n' "${old}" "${new}" | sort -V | tail -1)"
          if [ "${newest}" != "${new}" ]; then
            echo "::error title=Version moved backward::packages/lesson-contract went from ${old} to ${new}. Publishing that would move the latest dist-tag backward, and a consumer doing a bare install would silently get an older contract. This cannot be cleanly undone on a public registry."
            exit 1
          fi

          echo "version moved ${old} -> ${new}"

  # ============================================================================
  # PUBLISH THE LESSON CONTRACT
  # ============================================================================
  publish-contract:
    name: Publish lesson contract
    runs-on: ubuntu-latest
    needs: test
    # Merges to main only. Never publish from a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for short-lived
      # publish rights, so no long-lived NPM_TOKEN is stored in the repo.
      # Requires a trusted publisher configured on npmjs.com for this package,
      # naming this repository and this workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist/ is gitignored, so the tarball has nothing to ship without this.
      #
      # The assertion is not paranoia. `pnpm --filter <name>` exits 0 when the
      # filter matches nothing - it prints "No projects matched the filters" and
      # succeeds. Verified against pnpm 11.0.9, and --fail-if-no-match does not
      # change it. So a typo or a future rename would build nothing, exit clean,
      # and publish a tarball with no dist/ in it. Check the artifact exists
      # rather than trusting the build's exit code.
      - name: Build
        run: |
          set -euo pipefail
          pnpm --filter @onlooker-community/lesson-contract build
          if [ ! -s packages/lesson-contract/dist/index.js ]; then
            echo "::error title=Build produced no output::packages/lesson-contract/dist/index.js is missing or empty after the build. The --filter probably matched no project, which pnpm reports as success. Publishing now would ship a tarball without dist/."
            exit 1
          fi
          # Every schema the package ships, not just the headline one.
          # counter-observation.schema.json went unchecked for exactly as long
          # as this was a single hardcoded if, so add to this list when a schema
          # is added - `files: ["dist", "schema"]` means anything here ships.
          for schema in lesson counter-observation; do
            path="packages/lesson-contract/schema/${schema}.schema.json"
            if [ ! -s "$path" ]; then
              echo "::error title=Schema missing from the publish tree::${path} is missing or empty. These files are the reason this package is published; shipping without one produces a tarball that resolves for consumers and then fails them at validation."
              exit 1
            fi
          done

      - name: Publish if this exact version is not on the registry
        working-directory: packages/lesson-contract
        run: |
          set -euo pipefail

          # Trusted publishing needs npm >= 11.5.1. Older npm ignores the OIDC
          # token silently and falls back to looking for credentials it will not
          # find, so assert rather than discover that at publish time.
          npm_major_minor_patch="$(npm --version)"
          if ! printf '%s\n%s\n' "11.5.1" "${npm_major_minor_patch}" | sort -V -C; then
            echo "::error title=npm too old for trusted publishing::npm ${npm_major_minor_patch} does not support OIDC trusted publishing; 11.5.1 or newer is required. Bump NODE_VERSION or install a newer npm before this step."
            exit 1
          fi

          # id-token: write on this job is what makes OIDC possible. If that
          # permission is ever dropped, this variable disappears and npm would
          # fall back to searching for a token that no longer exists - failing
          # later and less legibly than this does.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC token unavailable::This job has no id-token permission, so npm cannot exchange an OIDC token for publish rights. Restore 'permissions: id-token: write' on the publish-contract job."
            exit 1
          fi

          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"

          # Fast path only. This asks whether the version is already on the
          # registry so the common no-op merge skips without a pointless publish
          # attempt - but it is NOT authoritative, and must not be treated as
          # such. A newly published package can 404 here for minutes while the
          # registry propagates: observed 2026-08-10, when 2.0.0 published at
          # 21:56:59 and this query still returned nothing at 22:01:22, four and
          # a half minutes later. Trusting it caused a republish attempt and a
          # red build. See onlooker-1um.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry; nothing to do"
            exit 0
          fi

          echo "registry did not report ${name}@${version}; attempting publish"

          # The registry is the authority, so interpret its answer rather than
          # predicting it. A publish that fails *because the version exists* is
          # the same outcome as the fast path above - benign, and not a build
          # failure. Any other failure is real and must surface.
          set +e
          publish_out="$(npm publish 2>&1)"
          publish_rc=$?
          set -e

          printf '%s\n' "${publish_out}"

          if [ "${publish_rc}" -eq 0 ]; then
            echo "published ${name}@${version}"
            exit 0
          fi

          # Match the specific message, not the E403 code. E403 also covers
          # "you do not have permission", which is emphatically not benign.
          if printf '%s' "${publish_out}" | grep -q 'cannot publish over the previously published versions'; then
            echo "::notice title=Already published::${name}@${version} was already on the registry; the pre-check missed it, most likely registry propagation lag. Treating as a no-op."
            exit 0
          fi

          echo "::error title=Publish failed::${name}@${version} could not be published, and not because it already exists. See the npm output above."
          exit "${publish_rc}"

  # ============================================================================
  # BUILD AND TEST
  # ============================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: quality
    if: success()
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify generated schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- packages/lesson-contract/schema)" ]; then
            git status --short -- packages/lesson-contract/schema
            echo "::error::packages/lesson-contract/schema is out of date. Run 'pnpm --filter @onlooker-community/lesson-contract build' and commit the result."
            exit 1
          fi

      - name: Test
        run: pnpm test

  # ============================================================================
  # WHICH SURFACES CHANGED
  # ============================================================================
  changes:
    name: Which surfaces changed
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to diff against the pre-push commit; the default shallow
          # fetch does not have it.
          fetch-depth: 0

      - name: Decide whether anything deployable changed
        id: filter
        run: |
          # A plain diff rather than a third-party paths-filter action: every
          # other action in this workflow is an official actions/* one, and
          # this is a dozen lines of shell.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to the branch, or a force-push with no usable base.
            # Deploy rather than guess: a redundant deploy is cheap, a skipped
            # one ships nothing.
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A force-push to main names a real-looking commit in
          # `github.event.before` that no longer exists in this clone. `git
          # diff` against a missing object is a hard error, and under `bash -e`
          # that fails the step and blocks every deploy behind it - the one
          # outcome this filter is supposed to prevent. An unreachable base gets
          # the same answer as a missing one: deploy rather than guess.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(apps/(api|web|website)/|packages/|package\.json|pnpm-lock\.yaml|turbo\.json|\.github/workflows/deploy\.yml)'; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Staging tracks main. There is no long-lived staging branch to keep in sync,
    # and production below will not run unless this succeeds first.
    #
    # `changes.deployable` keeps a CLI-only merge from redeploying the API, web
    # and website with identical code - which matters because
    # concurrency.cancel-in-progress can cancel a deploy already in flight.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.changes.outputs.deployable == 'true'
    environment:
      name: staging
      url: https://app-staging.onlooker.dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations to Staging
        run: pnpm migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Staging schema matches source
        run: pnpm --filter @onlooker/db verify:schema onlooker-db-staging staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Staging
        run: pnpm deploy:api:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Rebuilds the bundle rather than shipping the one "Build" produced. That
      # step runs `vite build` with no mode, which resolves .env.production and
      # bakes in api.onlooker.dev - and since the production job below ships the
      # same dist/, staging spent its life calling the production API against
      # the production database. VITE_* is inlined at build time, so a staging
      # bundle is the only way to aim staging anywhere else. The build fails if
      # what it produced does not call api-staging.onlooker.dev.
      - name: Deploy Web to Staging
        run: pnpm deploy:web:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The same assertions the cron heartbeat makes, run against what was just
      # deployed. Nothing between "wrangler deploy succeeded" and "a human
      # clicks something" used to look at the deployed site at all - the Verify
      # steps above are schema checks - which is how a production outage where
      # every route except / returned 404 survived several deploys.
      #
      # One script, two triggers. Here it fails the run while the change is
      # still in front of whoever made it; on the cron it catches drift
      # afterwards.
      #
      # The credentials below are what make the first sentence true. Without
      # them auth_preflight skips checks 5-8 and this gate silently asserts only
      # that the API can still say no - directly after the step that applies D1
      # migrations, which is the likeliest way to break saying yes.
      - name: Smoke test Staging
        env:
          HEARTBEAT_EMAIL: ${{ secrets.HEARTBEAT_EMAIL_STAGING }}
          HEARTBEAT_PASSWORD: ${{ secrets.HEARTBEAT_PASSWORD_STAGING }}
          HEARTBEAT_REQUIRE_AUTH: '1'
        run: ./scripts/heartbeat.sh staging

      - name: Notify Deployment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ job.status }}';
            const deployment_url = 'https://app-staging.onlooker.dev';
            const commit_sha = '${{ github.sha }}'.substring(0, 7);

            console.log(`Staging deployment: ${status}`);
            console.log(`URL: ${deployment_url}`);
            console.log(`Commit: ${commit_sha}`);

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Depends on deploy-staging, not test: production never ships a build that
    # has not already migrated and deployed cleanly to staging. The approval
    # gate on the production environment still applies on top of this.
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://app.onlooker.dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 auto-enables package-manager caching when package.json declares
          # packageManager - ours says pnpm. Every workflow installs pnpm AFTER
          # this step, so auto-caching would invoke a pnpm that does not exist
          # yet. Off keeps v4's behavior exactly.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations to Production
        run: pnpm migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Production schema matches source
        run: pnpm --filter @onlooker/db verify:schema onlooker-db production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Production
        run: pnpm deploy:api:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Also rebuilds, for the mirror-image reason: now that a staging build
      # exists and writes to the same dist/, whoever ran last would otherwise
      # decide what production ships. Each web deploy builds the bundle it
      # deploys, and asserts the bundle calls the API that deploy is named for.
      - name: Deploy Web to Production
        run: pnpm deploy:web:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The marketing site has no staging counterpart: apps/website declares no
      # environments, so there is one worker and one deploy. It sits in this job
      # rather than its own so it is behind the same production approval gate as
      # everything else user-facing.
      #
      # Until this step existed, merging a website change shipped nothing and
      # the run still went green.
      - name: Deploy Website to Production
        run: pnpm deploy:website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runs after the website deploy as well as the app and API, so it is the
      # last word on a production release. A failure here means production is
      # already serving the bad build - the gate is the alarm, not the
      # prevention - but the alarm rings in the run that caused it rather than
      # up to 31 minutes later on the cron, and next to the commit responsible.
      - name: Smoke test Production
        env:
          HEARTBEAT_EMAIL: ${{ secrets.HEARTBEAT_EMAIL_PRODUCTION }}
          HEARTBEAT_PASSWORD: ${{ secrets.HEARTBEAT_PASSWORD_PRODUCTION }}
          HEARTBEAT_REQUIRE_AUTH: '1'
        run: ./scripts/heartbeat.sh production

      - name: Notify Deployment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ job.status }}';
            const deployment_url = 'https://app.onlooker.dev';
            const commit_sha = '${{ github.sha }}'.substring(0, 7);

            console.log(`Production deployment: ${status}`);
            console.log(`URL: ${deployment_url}`);
            console.log(`Commit: ${commit_sha}`);
