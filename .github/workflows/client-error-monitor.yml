name: Client error monitor

# Reads the client error reports apps/web sends to POST /api/client-errors and
# fails when any appear, because a failing workflow sends email and email is
# the only alerting this project has that anyone actually watches.
#
# Why a cron job rather than an error service: what a vendor adds on top of
# this - symbolication on receipt, grouping, retention past 3 days, release
# tracking - is worth buying when there is traffic to group, and at roughly one
# user there is not. That decision has a dated revisit trigger of 2026-10-01,
# when trace spans stop being free (onlooker-k34).
#
# Hourly rather than every five minutes. The reports being watched here are
# already hours old by the time anyone can act on them, and each run reads over
# a million log rows, so a tighter schedule buys nothing and spends quota.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A slow run must never stack up behind the next scheduled one.
concurrency:
  group: client-error-monitor
  cancel-in-progress: false

jobs:
  client-errors:
    name: Check for reported client errors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Staging first and advisory, matching the heartbeat. A client error in
      # staging is usually someone's work in progress, and a monitor that fires
      # during normal development is one people mute - which would cost the
      # production signal too, since it is the same inbox.
      - name: Staging (advisory)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! scripts/client-error-monitor.sh staging; then
            echo "::warning title=Staging client errors::Client errors were reported in staging, or the monitor could not run. This does not fail the run."
            echo "⚠️ **Staging client errors** — see the step log above." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      # Production failures fail the run, which is the entire point of the job.
      #
      # Note this fails on exit 2 as well as exit 1 - on "the monitor could not
      # read the logs" as well as "errors were reported". Those are different
      # problems and the log says which, but both mean nobody is watching, and
      # a monitor that stays green while blind is the bug this replaces.
      - name: Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/client-error-monitor.sh production
