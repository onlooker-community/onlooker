name = "onlooker-web"
compatibility_date = "2024-12-16"

# Assets directory for Pages
[assets]
directory = "dist"

# Development environment variables
[env.development]
vars = { VITE_API_URL = "http://localhost:8787" }

# Staging environment
[env.staging]
vars = { VITE_API_URL = "https://api-staging.onlooker.dev" }
routes = [
  { pattern = "app-staging.onlooker.dev/*", zone_name = "onlooker.dev" }
]

# Production environment
[env.production]
vars = { VITE_API_URL = "https://api.onlooker.dev" }
routes = [
  { pattern = "app.onlooker.dev/*", zone_name = "onlooker.dev" }
]
