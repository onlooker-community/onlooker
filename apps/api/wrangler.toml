name = "onlooker-api"
main = "src/index.ts"
compatibility_date = "2024-12-16"
compatibility_flags = ["nodejs_compat"]

# Routes configuration
routes = [
  { pattern = "api.onlooker.dev/*", zone_name = "onlooker.dev" }
]

# ============================================================================
# DEVELOPMENT ENVIRONMENT
# ============================================================================
[env.development.vars]
DB_HOST = "localhost"
DB_PORT = "5432"
DB_NAME = "onlooker_dev"
JWT_SECRET = "dev-secret-key-change-in-production"
TOKEN_EXPIRY_MINUTES = "180"
REFRESH_TOKEN_EXPIRY_DAYS = "30"
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"

# Development: Use local D1 database (if available)
# Uncomment to test with local D1
# [[env.development.d1_databases]]
# binding = "DB"
# database_name = "onlooker_dev"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ============================================================================
# STAGING ENVIRONMENT
# ============================================================================
[env.staging]
# custom_domain lets Cloudflare create and manage the DNS record itself. A plain
# route does not create DNS, which is why api-staging.onlooker.dev never
# resolved even though the worker and the route both existed.
routes = [
  { pattern = "api-staging.onlooker.dev", custom_domain = true }
]

[env.staging.vars]
DB_HOST = "staging-db.onlooker.dev"
DB_PORT = "5432"
DB_NAME = "onlooker_staging"
TOKEN_EXPIRY_MINUTES = "180"
REFRESH_TOKEN_EXPIRY_DAYS = "30"
ENVIRONMENT = "staging"
CORS_ORIGIN = "https://app-staging.onlooker.dev"

# Staging: Use staging D1 database
[[env.staging.d1_databases]]
binding = "DB"
database_name = "onlooker-db-staging"
database_id = "ff3a01c8-aedb-4bc2-8231-b8511b353728"
# Points at packages/db, which owns the schema and generates these migrations.
# Previously "migrations" (apps/api/migrations), which described a different
# schema than packages/db did - that divergence is what onlooker-1g9 fixed.
migrations_dir = "../../packages/db/migrations"

# ============================================================================
# PRODUCTION ENVIRONMENT
# ============================================================================
[env.production]
routes = [
  { pattern = "api.onlooker.dev/*", zone_name = "onlooker.dev" }
]

[env.production.vars]
DB_HOST = "prod-db.onlooker.dev"
DB_PORT = "5432"
DB_NAME = "onlooker_prod"
TOKEN_EXPIRY_MINUTES = "180"
REFRESH_TOKEN_EXPIRY_DAYS = "30"
ENVIRONMENT = "production"
CORS_ORIGIN = "https://app.onlooker.dev"

# Production: Use production D1 database
[[env.production.d1_databases]]
binding = "DB"
database_name = "onlooker-db"
migrations_dir = "../../packages/db/migrations"
database_id = "5473b131-271e-4ce9-84e5-b48a93269dc8"

# ============================================================================
# OBSERVABILITY & MONITORING
# ============================================================================
[observability]
enabled = true
