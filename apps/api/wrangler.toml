name = "onlooker-api"
main = "src/index.ts"
compatibility_date = "2024-12-16"
compatibility_flags = ["nodejs_compat"]

# Routes configuration
routes = [
  { pattern = "api.onlooker.dev/*", zone_name = "onlooker.dev" }
]

# ============================================================================
# DEVELOPMENT ENVIRONMENT
# ============================================================================
# `pnpm dev` passes --env development, so everything below is what the local
# worker actually gets. It is not decoration: without it there is no DB binding
# and no JWT_SECRET, and every authenticated route fails with
# "Cannot read properties of undefined (reading 'prepare')".

# CORS_ORIGIN is declared in every block below and read by nothing. The worker
# hardcodes Access-Control-Allow-Origin: * (src/index.ts), so these values
# describe a policy that is not enforced - production says app.onlooker.dev and
# the deployed API accepts any origin. Left in place rather than deleted because
# the intent is right and the code is what should change; tracked separately,
# since honoring it alters live behavior on a deployed API and wants its own
# deploy.
[env.development.vars]
JWT_SECRET = "dev-secret-key-change-in-production"
TOKEN_EXPIRY_MINUTES = "180"
REFRESH_TOKEN_EXPIRY_DAYS = "30"
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"

# `wrangler dev` is local-first, so this resolves to a SQLite file under
# apps/api/.wrangler/ and never touches Cloudflare. database_id is required by
# the config schema but unused locally, hence the obviously-fake value - if a
# command ever tries to reach a real database with it, it should fail loudly
# rather than quietly hitting staging.
#
# Apply migrations before first use, and after any schema change:
#   pnpm --filter @onlooker/api exec wrangler d1 migrations apply onlooker-db-local --local --env development
[[env.development.d1_databases]]
binding = "DB"
database_name = "onlooker-db-local"
database_id = "00000000-0000-0000-0000-000000000000"
# packages/db owns the schema and generates these; see the note under staging.
migrations_dir = "../../packages/db/migrations"

# ============================================================================
# STAGING ENVIRONMENT
# ============================================================================
[env.staging]
# custom_domain lets Cloudflare create and manage the DNS record itself. A plain
# route does not create DNS, which is why api-staging.onlooker.dev never
# resolved even though the worker and the route both existed.
routes = [
  { pattern = "api-staging.onlooker.dev", custom_domain = true }
]

[env.staging.vars]
TOKEN_EXPIRY_MINUTES = "180"
REFRESH_TOKEN_EXPIRY_DAYS = "30"
ENVIRONMENT = "staging"
CORS_ORIGIN = "https://app-staging.onlooker.dev"

# Staging: Use staging D1 database
[[env.staging.d1_databases]]
binding = "DB"
database_name = "onlooker-db-staging"
database_id = "ff3a01c8-aedb-4bc2-8231-b8511b353728"
# Points at packages/db, which owns the schema and generates these migrations.
# Previously "migrations" (apps/api/migrations), which described a different
# schema than packages/db did - that divergence is what onlooker-1g9 fixed.
migrations_dir = "../../packages/db/migrations"

# ============================================================================
# PRODUCTION ENVIRONMENT
# ============================================================================
[env.production]
routes = [
  { pattern = "api.onlooker.dev/*", zone_name = "onlooker.dev" }
]

[env.production.vars]
TOKEN_EXPIRY_MINUTES = "180"
REFRESH_TOKEN_EXPIRY_DAYS = "30"
ENVIRONMENT = "production"
CORS_ORIGIN = "https://app.onlooker.dev"

# Production: Use production D1 database
[[env.production.d1_databases]]
binding = "DB"
database_name = "onlooker-db"
migrations_dir = "../../packages/db/migrations"
database_id = "5473b131-271e-4ce9-84e5-b48a93269dc8"

# ============================================================================
# OBSERVABILITY & MONITORING
# ============================================================================
[observability]
enabled = true
